# PaintingCMS — podman-compose topology (design D9)
# db (postgres:16) → api (NestJS, migrations on start) ← caddy (auto-TLS :80/:443)
#
# `.env` (repo root) is THE single source of truth. podman-compose reads it
# automatically for `${...}` interpolation below, and the `api` service also
# loads it wholesale via `env_file`. Never hardcode credentials here.
#
# Usage: just up   (build + start), just deploy (pull + up + health check)
services:
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only — for the bare-metal `just dev` workflow. Never public.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The whole .env flows into the container (PUBLIC_URL, BOT_TOKEN, ...).
    env_file:
      - .env
    environment:
      # Container-specific overrides: `db` is the compose service name.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      NODE_ENV: production
      PORT: 3000
      PHOTOS_STORAGE_DIR: /app/storage/photos
    volumes:
      - photos:/app/storage/photos

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # PUBLIC_URL is the single public origin: https://domain → auto-TLS via
    # Let's Encrypt; http://localhost → plain HTTP for a local smoke test.
    command: "caddy reverse-proxy --from ${PUBLIC_URL:?set PUBLIC_URL in .env} --to api:3000"

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:
