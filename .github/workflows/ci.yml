# PaintingCMS CI (design D9): verify → e2e → deploy (main only)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paintingcms
          POSTGRES_PASSWORD: paintingcms-test
          POSTGRES_DB: paintingcms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paintingcms -d paintingcms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers (with system deps)
        run: pnpm --filter @painting/web exec playwright install --with-deps
      - name: Run Playwright E2E
        env:
          # postgres service on the runner (test DB, isolated — never prod)
          DATABASE_URL: postgresql://paintingcms:paintingcms-test@localhost:5432/paintingcms_test
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        # Contract: the Playwright config's webServer starts the API (against
        # DATABASE_URL above) and the built web app; tests use mocked TMA.
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30

  deploy:
    needs: e2e
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "${SSH_USER}@${SSH_HOST}" '
            set -e
            cd /opt/paintingcms
            git pull --ff-only
            podman-compose up -d --build
            sleep 10
            curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost/health
          '
