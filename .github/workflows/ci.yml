# PaintingCMS CI (design D9): verify → e2e
# Deploys are manual on the server (`just deploy`) — the secrets you need stay
# on the server's `.env`, so CI never touches production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paintingcms
          POSTGRES_PASSWORD: paintingcms-test
          POSTGRES_DB: paintingcms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paintingcms -d paintingcms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers (with system deps)
        run: pnpm --filter @painting/web exec playwright install --with-deps
      - name: Run Playwright E2E
        env:
          # postgres service on the runner (test DB, isolated — never prod)
          DATABASE_URL: postgresql://paintingcms:paintingcms-test@localhost:5432/paintingcms_test
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        # Contract: the Playwright config's webServer starts the API (against
        # DATABASE_URL above) and the built web app; tests use mocked TMA.
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30
